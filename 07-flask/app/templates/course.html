{% extends "layout.html" %}

{% block content %}
<h1>{{ course.title }}</h1>

<div class="card">
    <div class="card-body">
        <h5 class="card-title">{{ course.courseID }}</h5>
        <p class="card-text"><strong>Description:</strong> {{ course.description }}</p>
        <p class="card-text"><strong>Credits:</strong> {{ course.credits }}</p>
        <p class="card-text"><strong>Term:</strong> {{ course.term }}</p>

        {% if session.get('username') %}
        <form action="{{ url_for('enrollment') }}" method="POST">
            <input type="hidden" name="courseID" value="{{ course.courseID }}">
            <input type="hidden" name="title" value="{{ course.title }}">
            <input type="hidden" name="term" value="{{ course.term }}">
            <button class="btn btn-primary">Enroll</button>
        </form>
        {% else %}
        <p><a href="{{ url_for('login') }}">Log in</a> to enroll.</p>
        {% endif %}

        <a href="{{ url_for('courses') }}" class="btn btn-secondary">Back to Courses</a>
    </div>
</div>
{% endblock %}
